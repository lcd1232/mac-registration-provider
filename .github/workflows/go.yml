name: Go

on:
  push:

env:
  GO_VERSION: "1.21"

jobs:
  build:
    # Everything runs on the arm64 runner; the x86_64 slice is cross-compiled
    # with cgo (clang can target both arches). Intel (macos-13) runners are
    # unreliable to schedule on forks, so we avoid depending on them.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build arm64
        run: |
          CGO_ENABLED=1 GOARCH=arm64 MACOSX_DEPLOYMENT_TARGET=11.0 \
            go build -v -ldflags "-X main.Commit=${{ github.sha }}" \
            -o mac-registration-provider-arm64

      - name: Build x86_64 (cross-compile)
        run: |
          CGO_ENABLED=1 GOARCH=amd64 CC="clang -arch x86_64" MACOSX_DEPLOYMENT_TARGET=10.13 \
            go build -v -ldflags "-X main.Commit=${{ github.sha }}" \
            -o mac-registration-provider-x86

      - name: Build universal binary
        run: |
          lipo -create -output mac-registration-provider-universal \
            mac-registration-provider-x86 mac-registration-provider-arm64

      - name: Run the binary
        # The CI runner's exact macOS build may not have offsets in the map,
        # so treat the smoke test as non-fatal (the build artifacts are the goal).
        continue-on-error: true
        run: ./mac-registration-provider-arm64 -once

      - uses: actions/upload-artifact@v4
        with:
          name: mac-registration-provider-arm64
          path: mac-registration-provider-arm64
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mac-registration-provider-x86
          path: mac-registration-provider-x86
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mac-registration-provider-universal
          path: mac-registration-provider-universal
          if-no-files-found: error
